name: projeto.io

services:
  db:
    image: postgres:16-alpine
    container_name: projetoio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-pm_app}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Publicada só no loopback do host por padrão (${HOST_BIND_IP:-127.0.0.1}): ferramentas
      # locais (psql, DBeaver) continuam alcançando via 127.0.0.1, mas a porta nunca fica
      # exposta à internet mesmo que o firewall do host esteja mal configurado. Em produção o
      # backend fala com o Postgres pela rede interna do Compose (projetoio_default) — não
      # depende desta publicação, que pode até ser removida por completo no servidor.
      - "${HOST_BIND_IP:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-pm_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: projetoio-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-pm_app}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Loopback do host por padrão — em produção o Nginx Proxy Manager alcança este container
      # pela rede `proxy` (ver README), não por esta porta publicada.
      - "${HOST_BIND_IP:-127.0.0.1}:3000:3000"
    networks:
      - default
      - proxy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
    container_name: projetoio-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Loopback do host por padrão — em produção o Nginx Proxy Manager alcança este container
      # pela rede `proxy` (ver README), não por esta porta publicada.
      - "${HOST_BIND_IP:-127.0.0.1}:5173:80"
    networks:
      - default
      - proxy

volumes:
  db_data:
    name: projetoio_db_data

networks:
  default:
    name: projetoio_default
  proxy:
    external: true
    name: proxy
