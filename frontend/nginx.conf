server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança. HSTS só tem efeito quando a resposta chega via HTTPS (o TLS
    # termina no Nginx Proxy Manager, ver README) — em HTTP/localhost o navegador ignora.
    # CSP: este SPA (Vite) só carrega recursos próprios + o widget do Cloudflare Turnstile
    # (script/frame/connect em challenges.cloudflare.com). `connect-src 'self'` assume API e
    # WebSocket na MESMA origem (arranjo recomendado no README) — se a API for para outro
    # domínio/subdomínio, acrescente-o em `connect-src`. `img-src` permite https: por causa de
    # avatares apontando para URLs externas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; frame-src https://challenges.cloudflare.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; script-src 'self' https://challenges.cloudflare.com" always;

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # `add_header` num location não herda os do server — repetidos aqui de propósito.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; frame-src https://challenges.cloudflare.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; script-src 'self' https://challenges.cloudflare.com" always;
    }
}
