    <rect x="10" y="20" width="46" height="140" rx="14" fill="url(#iconGrad)"/>
    <rect x="66" y="20" width="46" height="70" rx="14" fill="url(#iconGradLight)"/>
    <rect x="66" y="98" width="46" height="34" rx="12" fill="#2A2440"/>
    <circle cx="89" cy="55" r="9" fill="#0E0B1A"/>
  </g>

  <!-- Wordmark -->
  <text x="140" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#EDEBFB">Projeto<tspan fill="#8B7CF6">.io</tspan></text>
</svg>
