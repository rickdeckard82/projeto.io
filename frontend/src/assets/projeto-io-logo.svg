<svg width="640" height="180" viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C6CF6"/>
      <stop offset="100%" stop-color="#4C3ED9"/>
    </linearGradient>
    <linearGradient id="iconGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D5EF0"/>
    </linearGradient>
  </defs>

  <!-- Icon: three abstract kanban-style bars forming a stylized "P" negative space -->
